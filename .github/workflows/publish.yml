name: Publish

# The MCPB bundle is built and signed outside GitHub. To release, publish a GitHub release tagged v<version> (for
# example v26.0.0-4) with that signed openstaad-mcp.mcpb attached; this workflow then lists it in the MCP Registry.
on:
  release:
    types: [published]

jobs:
  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mcp-publisher login github-oidc
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download MCPB from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern openstaad-mcp.mcpb

      - name: Check that the MCPB version matches the tag
        run: |
          VERSION="${TAG#v}"
          MCPB_VERSION=$(unzip -p openstaad-mcp.mcpb manifest.json | jq -r .version)
          if [ "$MCPB_VERSION" != "$VERSION" ]; then
            echo "::error::openstaad-mcp.mcpb is version $MCPB_VERSION, but the release tag is $TAG."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Update server.json with version and hash
        run: |
          HASH=$(sha256sum openstaad-mcp.mcpb | awk '{print $1}')
          jq --arg v "$VERSION" \
             --arg url "https://github.com/BentleySystems/openstaad-mcp/releases/download/${TAG}/openstaad-mcp.mcpb" \
             --arg hash "$HASH" \
             '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $hash' \
             server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
