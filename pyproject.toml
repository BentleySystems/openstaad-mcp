[build-system]
# >=77 for the SPDX `license` string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openstaad-mcp"
# The version is now read dynamically. See [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "MCP server for Bentley STAAD.Pro via OpenSTAAD API"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]

# Author details.
authors = [
    { name = "Bentley Systems Inc." }
]

# Keywords for package discovery on PyPI.
keywords = ["STAAD.Pro", "OpenSTAAD", "automation", "structural-engineering", "COM", "STAAD"]

# PyPI classifiers to help users find the project.
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]


# Runtime dependencies required by the package.
dependencies = [
    "fastmcp>=3.2.3,<4",
    "packaging>=24",
    "starlette>=1.0.0,<2.0.0",
    "pydantic>=2,<3",
    "pywin32>=311; platform_system == 'Windows'",
    "openstaadpy @ git+https://github.com/BentleySystems/openstaadpy.git@26.0.1.14",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7",
    "chardet>=5,<7.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]
build = [
    "pyinstaller>=6.19.0",
]

[project.scripts]
openstaad-mcp = "openstaad_mcp.main:main"

[project.urls]
Homepage = "https://github.com/BentleySystems/openstaad-mcp"
Issues = "https://github.com/BentleySystems/openstaad-mcp/issues"

# --- Tool-specific configurations ---

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/openstaad_mcp/staad_skills", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF200"]

[tool.ruff.lint.isort]
known-first-party = ["openstaad_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires running STAAD.Pro instance (Windows only)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openstaad_mcp = ["staad_skills/**/*.md"]

[tool.setuptools.dynamic]
version = { attr = "openstaad_mcp._version.__version__" }